name: CI

on:
  push:
  pull_request:

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      # The production build is not run yet: src/pages/admin/AdminDashboard.js
      # imports two components (UsersTable, ReportedContentTable) that were never committed.
      - run: npm ci

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      MONGOMS_DISABLE_POSTINSTALL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Syntax check
        run: find . -name '*.js' -not -path './node_modules/*' -exec node --check {} +
